{% set python_min = "3.11" %}
{% set name = "ptychodus" %}
{% set version = "1.5.1" %}

package:
  name: ptychodus-split
  version: {{ version }}

source:
  url: https://github.com/AdvancedPhotonSource/ptychodus/archive/refs/tags/v{{ version }}.zip
  sha256: 1d4035063f462c996023e72cbc7f15d235b5a00e99dd6e6f065e2a70b490b773

build:
  number: 0

outputs:
  # all optional packages
  - name: ptychodus-all

    build:
      noarch: generic

    requirements:
      run:
        - {{ pin_subpackage('ptychodus', exact=True) }}
        - globus-compute-sdk
        - globus-sdk >=4.5.0
        - xraydb >=4.5

    test:
      imports:
        - ptychodus
      requires:
        - pip
      commands:
        - pip check
        - ptychodus --version

  # with QT
  - name: ptychodus

    build:
      noarch: generic

    requirements:
      run:
        - {{ pin_subpackage('ptychodus-core', exact=True) }}
        - pyqt

    test:
      imports:
        - ptychodus
      requires:
        - pip
      commands:
        - pip check
        - ptychodus --version

  # ptychodus without QT (headless) without optional packages
  - name: ptychodus-core

    script: build-core.sh

    build:
      noarch: python
      entry_points:
        - convert-to-ptychodus = ptychodus.cli.convert_to_ptychodus:main
        - ptychodus = ptychodus.__main__:main
        - ptychodus-bdp = ptychodus.cli.ptychodus_bdp:main
        - ptychodus-system-check = ptychodus.cli.ptychodus_system_check:main

    requirements:
      host:
        - pip
        - python {{ python_min }}
        - setuptools >=80
        - setuptools_scm >=9.2
      run:
        - colorcet
        - h5py >=3
        - hdf5plugin
        - httpx
        - matplotlib-base
        - mlflow-skinny
        - numpy
        # conda-forge's pydantic-ai is pydantic-ai-slim without the provider extras,
        # so openai must be requested explicitly; ptychodus.model.agent.terminal
        # imports pydantic_ai.models.openai unconditionally.
        - openai
        - psutil
        - pydantic
        - pydantic-ai >=1.0,<3
        - python >={{ python_min }}
        - pyyaml
        - scikit-image
        - scipy
        - tifffile
        - watchdog
      run_constrained:
        - globus-sdk >=4.5.0
        - globus-compute-sdk
        - pyqt =5.*
        - xraydb >=4.5

    test:
      imports:
        - ptychodus
      requires:
        - pip
        - python {{ python_min }}
      commands:
        - pip check
        - ptychodus --version
        - convert-to-ptychodus --help
        - ptychodus-bdp --help
        - ptychodus-system-check
        - test ! -f "$PREFIX/bin/ptychodus-store"

about:
  home: https://github.com/AdvancedPhotonSource/ptychodus
  summary: Ptychodus is a ptychography data pipeline application.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  dev_url: https://github.com/AdvancedPhotonSource/ptychodus

extra:
  recipe-maintainers:
    - AdvancedPhotonSource/ptychodus
    - carterbox
    - stevehenke
